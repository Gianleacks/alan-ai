<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Alan</title>
<meta name="theme-color" content="#0B1D26">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="console">

    <header class="console__header">
      <span class="console__eyebrow">UNITÀ DI ASCOLTO</span>
      <h1 class="console__title">ALAN</h1>
    </header>

    <section class="dial" id="dial" aria-hidden="true">
      <div class="dial__ticks">
        <div class="dial__tick" style="--i:0"></div>
        <div class="dial__tick" style="--i:1"></div>
        <div class="dial__tick" style="--i:2"></div>
        <div class="dial__tick" style="--i:3"></div>
        <div class="dial__tick" style="--i:4"></div>
        <div class="dial__tick" style="--i:5"></div>
        <div class="dial__tick" style="--i:6"></div>
        <div class="dial__tick" style="--i:7"></div>
        <div class="dial__tick" style="--i:8"></div>
        <div class="dial__tick" style="--i:9"></div>
        <div class="dial__tick" style="--i:10"></div>
        <div class="dial__tick" style="--i:11"></div>
      </div>
      <div class="dial__ring"></div>
      <div class="dial__core">
        <span class="dial__status" id="status">Spento</span>
      </div>
    </section>

    <button class="talk-btn" id="talkBtn" type="button">
      <span id="talkBtnLabel">Attiva Alan</span>
    </button>
    <p class="hint" id="hint">Dopo l'attivazione, di' "Alan" seguito dal comando — non serve più premere nulla.</p>

    <section class="log" id="log" aria-live="polite">
      <p class="log__hint">La conversazione comparirà qui.</p>
    </section>

    <section class="archive" id="archive">
      <span class="archive__eyebrow">ARCHIVIO</span>
      <div class="archive__scene" id="archiveScene">
        <p class="archive__hint">I contenuti di cui parliamo appariranno qui.</p>
      </div>
    </section>

  </main>

<script src="app.js"></script>
</body>
</html>
